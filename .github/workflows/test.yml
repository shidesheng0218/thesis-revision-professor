name: test

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile
        run: |
          PYTHONPYCACHEPREFIX=/tmp/trp-pycache python -m py_compile scripts/*.py
          PYTHONPYCACHEPREFIX=/tmp/trp-pycache python -m py_compile thesis_revision_professor/*.py
      - name: Smoke test
        run: python tests/run_smoke.py
      - name: Build and run installed wheel
        run: |
          python -m pip wheel . --no-deps --no-build-isolation -w /tmp/trp-wheel
          python -m pip install --no-deps --target /tmp/trp-installed /tmp/trp-wheel/thesis_revision_professor-*.whl
          PYTHONPATH=/tmp/trp-installed python -m thesis_revision_professor --help
      - name: Release gate
        run: python scripts/release_gate.py
