[metadata]
name = thesis-revision-professor
version = 0.3.0
description = Evidence-bound hybrid thesis review, loss-minimizing Word revision, and auditable revision loops.
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT

[options]
packages = find:
python_requires = >=3.9
include_package_data = True

[options.packages.find]
include = thesis_revision_professor*

[options.package_data]
thesis_revision_professor.resources = *.json

[options.entry_points]
console_scripts =
    thesis-review = thesis_revision_professor.__main__:main
